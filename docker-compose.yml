services:
  db:
    image: postgres:16
    container_name: neuromentor-db
    environment:
      POSTGRES_USER: neuromentor
      POSTGRES_PASSWORD: neuromentor
      POSTGRES_DB: neuromentor
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neuromentor -d neuromentor"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: neuromentor-api
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      # Sobreescreve o host do banco para apontar ao serviço "db" do compose
      ConnectionStrings__Default: "Host=db;Port=5432;Database=neuromentor;Username=neuromentor;Password=neuromentor"
      ASPNETCORE_URLS: "http://+:8080"
    ports:
      - "8080:8080"

volumes:
  pgdata:
